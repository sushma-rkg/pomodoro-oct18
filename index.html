<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen" id="screen" data-state="idle">
    <div class="frame">
      <div class="frame-inner">
        <div class="art"></div>
      </div>
    </div>
    <div class="timer" id="timer">25:00</div>
    <div class="plaque" id="plaque">
      <p class="title">Evening by the Harbour</p>
      <p class="artist">Marguerite Lenoir</p>
      <p class="year">1887</p>
    </div>
    <div class="buttons">
      <button type="button" class="btn primary" id="main-button">Start</button>
      <button type="button" class="btn secondary" id="reset-button">Reset</button>
    </div>
    <p class="hint" id="hint">The painting's details appear when the timer ends.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
