<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen" id="screen" data-state="idle">
    <div class="frame">
      <div class="frame-inner">
        <div class="art" id="art" data-art="loading">
          <div class="art-clip">
            <img class="art-image" id="art-image" alt="A painting from the Metropolitan Museum of Art">
          </div>
          <span class="art-message">Loading artwork...</span>
        </div>
      </div>
    </div>
    <div class="timer" id="timer">00:30</div>
    <div class="plaque" id="plaque" hidden>
      <p class="title" id="plaque-title"></p>
      <p class="artist" id="plaque-artist"></p>
      <p class="year" id="plaque-year" hidden></p>
      <a class="plaque-link" id="plaque-link" target="_blank" rel="noopener noreferrer" hidden>View on the Met website</a>
    </div>
    <div class="buttons">
      <button type="button" class="btn primary" id="main-button">Start</button>
      <button type="button" class="btn secondary" id="reset-button">Reset</button>
    </div>
    <p class="hint" id="hint">The painting's details appear when the timer ends.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
